name: whatscrm

services:
  app:
    build:
      context: ./server
    container_name: whatscrm-app
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      PORT: "3010"
      NODE_ENV: production
      TZ: America/Sao_Paulo
      DBHOST: mariadb
      DBPORT: "3306"
      DBNAME: whatscrm
      DBUSER: whatscrm
      DBPASS: ${DB_PASS:?Defina DB_PASS no .env}
      JWTKEY: ${JWTKEY:?Defina JWTKEY no .env}
      FRONTENDURI: ${FRONTENDURI:-https://app.gstd.com.br}
      BACKURI: ${BACKURI:-https://app.gstd.com.br}
      DOMAIN: ${DOMAIN:-https://app.gstd.com.br}
      MONGO_DB_NAME: wacrm_session
      STRIPE_LANG: pt
    depends_on:
      mariadb:
        condition: service_healthy
      mongo:
        condition: service_started
    volumes:
      - app_media:/app/client/public/media
      - app_languages:/app/languages

  mariadb:
    image: mariadb:10.11
    container_name: whatscrm-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: whatscrm
      MARIADB_USER: whatscrm
      MARIADB_PASSWORD: ${DB_PASS:?Defina DB_PASS no .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?Defina DB_ROOT_PASS no .env}
    volumes:
      # Datadir fora da raiz '/' (que vive em 83-89%). /home tem disco dedicado.
      # Rollback: voltar para "db_data:/var/lib/mysql" (volume antigo preservado).
      - ${DB_DATA_DIR:-/home/docker/whatscrm-db}:/var/lib/mysql
      - ./database/import.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Multi-tenant: idempotente, seguro no primeiro boot do volume
      - ./server/database/migrations/20261014_01_multi_tenant_core.sql:/docker-entrypoint-initdb.d/02-multitenant.sql:ro
      # Backfill legado + coluna tenant_id em chats/agent_chats (apos o 02)
      - ./server/database/migrations/20261014_02_backfill_legacy.sql:/docker-entrypoint-initdb.d/03-backfill.sql:ro
      # Troca obrigatoria de senha do super admin (apos o 03)
      - ./server/database/migrations/20261019_superadmin_force_password_change.sql:/docker-entrypoint-initdb.d/04-superadmin-password.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    container_name: whatscrm-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  # db_data: mantido apenas como rollback; o MariaDB agora usa /home/docker/whatscrm-db
  mongo_data:
  app_media:
  app_languages:
